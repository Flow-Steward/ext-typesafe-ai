name: Release extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: Flow-Steward/extensions/.github/workflows/release-extension.yml@14b5a23a3893191492e6dd5afff476a384e57545
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
