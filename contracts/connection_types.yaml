connection_types:
  - connection_type_id: typesafe_jev
    display_name: TypeSafe JEV
    description: A project-scoped TypeSafe API key, default JEV model and bounded timeout.
    config_schema:
      type: object
      additionalProperties: false
      properties:
        model: {type: string, default: jev-latest}
        timeout_seconds: {type: integer, minimum: 1, maximum: 60, default: 30}
    secret_schema:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key: {type: string, minLength: 1}
    capabilities: {evaluate: true, test_connection: true}
