schema_version: extension_descriptor_v1
extension_id: flowsteward.typesafe-ai
release_version: 1.0.6
extension_type: service_extension
identity:
  display_name: TypeSafe AI (JEV)
  description: 'Classify requests, score priorities and route workflow outcomes with TypeSafe AI''s JEV structured
    decisions. Send text, an object or an array as state, together with named Choice, Score or Noul questions. The
    action returns the selected model, answer objects and usage information for subsequent workflow steps.


    Choice answers include a selected option, confidence and option probabilities. Score answers include the score,
    confidence, legend and probabilities. Noul returns a yes probability. These outputs let you build classification,
    prioritization and routing rules with thresholds that you control. Noul probability and Choice or Score confidence
    represent different quantities, so choose routing rules to match the question type.


    An optional, separately imported support-triage example combines category, urgency and human-review questions
    using a reusable child workflow. It returns a routing recommendation; you connect the outcome to your own ticketing
    or human-handling process. The extension is a decision tool rather than a chat-model provider. It supports text
    and structured state, while image and Box questions are outside this release. Inputs are sent to TypeSafe, and
    provider credits and model access apply.'
  tags:
  - typesafe
  - jev
  - classification
  - routing
vendor:
  vendor_name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-typesafe-ai/issues
listing: {visibility: public_reference, category: ai}
distribution:
  channel: private_byo
  execution_modes: [local]
  allows_self_hosted: true
  requires_connected_control_plane: false
  import_sources: [file]
runtime:
  contract_version: extension_host_v2
  compatibility: {platform_min: 1.0.0}
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    resource_query_manifest: contracts/resource_query_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
artifacts:
  extensions:
    - {extension_id: flowsteward.typesafe-ai, ref: extension.yaml, publish: true}
provenance: {origin: user_generated}
commerce: {billing_mode: free}
