manifest_version: 2
extension_id: flowsteward.typesafe-ai
kind: tool_provider
version: 1.0.6
lifecycle: {data_schema_version: 1, data_migrations: []}
release_stage: active
display_name: TypeSafe AI (JEV)
description: |-
  Classify requests, score priorities and route workflow outcomes with TypeSafe AI's JEV structured decisions. Send text, an object or an array as state, together with named Choice, Score or Noul questions. The action returns the selected model, answer objects and usage information for subsequent workflow steps.

  Choice answers include a selected option, confidence and option probabilities. Score answers include the score, confidence, legend and probabilities. Noul returns a yes probability. These outputs let you build classification, prioritization and routing rules with thresholds that you control. Noul probability and Choice or Score confidence represent different quantities, so choose routing rules to match the question type.

  An optional, separately imported support-triage example combines category, urgency and human-review questions using a reusable child workflow. It returns a routing recommendation; you connect the outcome to your own ticketing or human-handling process. The extension is a decision tool rather than a chat-model provider. It supports text and structured state, while image and Box questions are outside this release. Inputs are sent to TypeSafe, and provider credits and model access apply.
vendor:
  name: Flow Steward
  website_url: https://github.com/Flow-Steward/ext-typesafe-ai
  support_url: https://github.com/Flow-Steward/ext-typesafe-ai/issues
listing:
  category: ai
  tags:
  - typesafe
  - jev
  - classification
  - routing
  - scoring
  summary: Evaluate text or structured state with TypeSafe JEV Choice, Score and Noul questions for classification
    and routing.
  setup_summary: Create a project TypeSafe connection with an API key, choose a default model and test the connection.
    If using the optional support-triage workflow, import its separate asset and map the extension and connection
    dependencies before enabling it.
features: [tool, action]
required_scopes: [extension:invoke]
machine_auth:
  service_account_key: svc_ext_typesafe_ai
  required_scopes: [extension:invoke]
account_scope:
  scope_type: project
  description: Each project selects its own TypeSafe connections and encrypted API keys.
runtime_grants:
  resources:
    project_connection: {scope: owning_extension}
  mutations:
    project_connection_upsert: {scope: owning_extension}
    project_connection_secrets_save:
      scope: owning_extension
      secret_keys: [api_key]
      connection_type_ids: [typesafe_jev]
egress:
  hosts: [api.typesafe.ai]
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
  input:
    type: object
    properties: {action: {type: object}}
  output:
    type: object
    required: [ok]
    properties:
      ok: {type: boolean}
      result: {type: object}
      error_code: {type: string}
      error: {type: string}
      errors: {type: array}
      failure_class: {type: string}
      retryable: {type: boolean}
      external_effect_status: {type: string}
      definitely_no_external_effect: {type: boolean}
      http_status: {type: integer}
entrypoint:
  mode: subprocess
  command: [python3, main.py]
  timeout_seconds: 90
health:
  command: [python3, health.py]
  timeout_seconds: 5
python_requirements: []
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    resource_query_manifest: contracts/resource_query_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
