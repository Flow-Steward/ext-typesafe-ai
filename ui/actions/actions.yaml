actions:
- action_id: evaluate
  title: Classify or score state with JEV
  description: Send text or structured state and named Choice, Score or Noul questions through a TypeSafe connection.
    Returns answer objects, model and usage for later routing steps; an optional workflow secret overrides the connection
    key for this call.
  handler:
    mode: extension
  workflow_visible: true
  mutates_platform: false
  required_scopes:
  - extension:invoke
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: state
    type: json
    required: true
  - name: questions
    type: object
    required: true
  - name: model
    type: string
    required: false
  - name: api_key
    type: string
    required: false
  result_fields:
  - model
  - answers
  - usage
- action_id: test_connection
  title: Test TypeSafe authentication and list models
  description: Authenticate using the selected TypeSafe connection and list accessible JEV models. Does not send
    state or make a classification request.
  handler:
    mode: extension
  workflow_visible: true
  mutates_platform: false
  required_scopes:
  - extension:invoke
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  result_fields:
  - models
